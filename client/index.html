<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Diwali Meet Up — Social village</title>
    <meta name="theme-color" content="#170b28" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ffb02e'/></svg>"
    />
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="app">
      <!-- 3D viewport -->
      <canvas id="gl"></canvas>
      <div id="labels"></div>

      <!-- landscape guard: gameplay is mobile-landscape only -->
      <div id="rotate-device" role="status" aria-live="polite" hidden>
        <div class="rotate-device__phone" aria-hidden="true"></div>
        <strong>Rotate to landscape</strong>
        <p>Diwali Meet Up plays in landscape mode.</p>
      </div>

      <!-- full-screen flow screens are injected by screens.js into #screens -->
      <div id="screens"></div>

      <div id="startup-error" class="screen active" role="alert" hidden>
        <div class="panel">
          <h2>Could not start the game</h2>
          <p>
            Reload to retry. If this keeps happening, use an updated Safari or
            Chrome browser with WebGL enabled.
          </p>
          <button id="startup-retry" class="btn" type="button">Reload</button>
        </div>
      </div>

      <!-- in-game HUD -->
      <div id="hud" hidden>
        <div class="hud-chip" id="hud-chip">
          <span class="dot" id="hud-dot"></span>
          <span id="hud-name">…</span>
          <span class="hud-room" id="hud-room" title="ping 0 ms"
            >village-1</span
          >
        </div>

        <div class="hud-wallet" id="wallet-chip" title="Diwali Coins">
          <span class="coin">🪙</span><span id="wallet-balance">7500</span>
        </div>

        <div class="compass" id="compass" aria-hidden="true">
          <div class="compass-window">
            <div class="compass-clip">
              <div class="compass-tape" id="compass-tape"></div>
            </div>
            <span class="compass-caret"></span>
          </div>
          <div class="compass-readout">
            <span id="compass-cardinal">N</span>
            <span id="compass-degrees">000°</span>
          </div>
        </div>

        <div class="hud-topright">
          <button
            class="icon-btn"
            id="btn-players"
            title="Players (P)"
            aria-label="Players"
            data-key="P"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btn-inventory"
            title="Firecrackers (I)"
            aria-label="Firecracker inventory"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 3v9a5 5 0 0 0 10 0V8" />
              <path
                d="M5 21a4 4 0 0 1-4-4V9a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v8a4 4 0 0 1-4 4z"
              />
              <path d="M9 12l3 3M20 3l-2 2M22 8h-3M17 1l-1 2" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btn-friends"
            title="Friends (B)"
            aria-label="Friends"
            data-key="B"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M12 17.8 18.9 24l-1.8-7M12 17.8 5.1 24l1.8-7M12 17.8l1.8-6.3 6.7-.5-5.2-4.4 1.9-6.6L12 4l-5.2 3.9 1.9 6.6-5.2 4.4 6.7.5z"
              />
            </svg>
          </button>
          <button
            class="icon-btn time-btn"
            id="btn-timeofday"
            title="Switch to day (T)"
            aria-label="Switch to day"
            data-key="T"
          >
            ☀
          </button>
          <button
            class="icon-btn"
            id="btn-fullscreen"
            title="Fullscreen (G)"
            aria-label="Fullscreen"
            data-key="G"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btn-settings"
            title="Settings"
            aria-label="Settings"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
              />
            </svg>
          </button>
        </div>

        <div id="players-panel" class="glass-panel" hidden>
          <h3>Players here</h3>
          <ul id="players-list"></ul>
        </div>

        <div id="friends-panel" class="glass-panel" hidden>
          <h3>Friends</h3>
          <div class="row" id="friends-add-row">
            <input
              id="friend-name-input"
              maxlength="20"
              placeholder="Name..."
            />
            <button id="friend-add-btn">Add</button>
          </div>
          <ul id="friends-list"></ul>
        </div>

        <div id="chat-log" aria-live="polite"></div>

        <form id="chat-form" autocomplete="off">
          <button
            type="button"
            id="chat-voice-btn"
            class="chat-voice"
            title="Toggle microphone (V)"
            aria-label="Toggle microphone"
            aria-pressed="false"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect x="9" y="2" width="6" height="12" rx="3" />
              <path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8" />
            </svg>
            <span class="chat-voice-label">Voice</span>
          </button>
          <input id="chat-input" maxlength="200" placeholder="Say something…" />
          <button
            id="chat-send"
            type="submit"
            aria-label="Send message"
            title="Send message"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M22 2 11 13" />
              <path d="M22 2 15 22l-4-9-9-4z" />
            </svg>
          </button>
        </form>

        <div id="emote-bar">
          <button
            type="button"
            data-emote="wave"
            data-key="1"
            aria-label="Wave"
          >
            <span class="emote-glyph" aria-hidden="true">👋</span>
            <span>Wave</span>
          </button>
          <button
            type="button"
            data-emote="dance"
            data-key="2"
            aria-label="Dance"
          >
            <span class="emote-glyph" aria-hidden="true">🕺</span>
            <span>Dance</span>
          </button>
          <button
            type="button"
            data-emote="greet"
            data-key="3"
            aria-label="Greet"
          >
            <span class="emote-glyph" aria-hidden="true">🤝</span>
            <span>Greet</span>
          </button>
        </div>

        <div id="fx-bar" hidden aria-label="Firecracker quick-use bar"></div>
        <div id="interact-prompt" hidden></div>

        <!-- mobile controls -->
        <div id="touch-controls" hidden>
          <div id="joystick"><div id="joy-knob"></div></div>
          <button id="btn-use" type="button" hidden>Use</button>
          <button
            id="btn-jump"
            aria-label="Jump"
            title="Jump"
            type="button"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              class="jump-glyph"
            >
              <circle cx="12" cy="4" r="2" fill="currentColor" stroke="none" />
              <path
                d="M9 9.5 6.5 5.8M15 9.5l2.5-3.7M8.6 10.6 12 8.2l3.4 2.4M12 8.2v5.3M12 13.5 7.8 18M12 13.5l4.2 4.5"
              />
            </svg>
            <span>Jump</span>
          </button>
        </div>
        <div id="cam-touch" hidden></div>

        <footer class="game-footer">
          <span>Diwali Village</span>
          <span aria-hidden="true">•</span>
          <span>Celebrate with kindness</span>
        </footer>
      </div>

      <!-- toasts live above both the HUD and modal screens so purchase / error
         feedback is never hidden behind the shop overlay -->
      <div id="toasts"></div>
    </div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
